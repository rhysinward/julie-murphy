project:
  type: website
  output-dir: _site
  resources:
    - assets/img/*
    - files/*

website:
  title: "Julie Murphy"
  site-url: https://rhysinward.github.io/julie-murphy/
  image: assets/img/julie-murphy.jpg
  open-graph: true
  twitter-card:
    card-style: summary
  description: "International commercial leader in aviation, business travel and luxury travel. Head of Trade Relations & Partnerships EMEA at All Nippon Airways (ANA)."
  favicon: assets/img/favicon.svg
  search: false
  navbar:
    right:
      - text: Career
        href: index.qmd#career
      - text: Profile
        href: index.qmd#what-i-do
      - text: Impact
        href: index.qmd#impact
      - text: Industry roles
        href: index.qmd#roles
      - text: Speaking
        href: index.qmd#speaking
      - text: Contact
        href: index.qmd#contact
  page-footer:
    left: "© 2026 Julie Murphy. Views are my own."
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme: [default, assets/theme.scss]
    include-in-header:
      - assets/fonts.html
      - assets/person.html
    toc: false
    lang: en-GB
    anchor-sections: false
    html-math-method: plain
    link-external-newwindow: true
    page-layout: full
