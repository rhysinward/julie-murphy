# Career timeline and industry roles. Both the Career section and the Board and
# industry leadership section read this one file.
#
# lane    airline, industry, moment or undated. This decides where an item appears.
# key     short name, also the deep link: key csm gives the link #career-csm.
# start   "YYYY-MM", or "YYYY" if only the year is on record. Always in quotes.
# end     "YYYY-MM", present (still doing it), or unknown (ended, date not on record).
#         Never guess a month. If there is no date on record, leave start out and
#         use lane: undated. Nothing else in the site needs editing to add a role.
# shift   one sentence on what changed in this role. It opens the role's text.
# rail    the short label on the chart. strong: true gives it heavier type.
# label   a moment with a label gets a mark on the chart. Without one, it is still
#         reached with Earlier and Later, and is listed under That year.
# card    true also shows the item in Board and industry leadership. Its text then appears there, not in the undated list.

# Airline roles, newest first.

- key: head
  lane: airline
  title: Head of Trade Relations & Partnerships, EMEA
  employer: All Nippon Airways (ANA)
  place: London
  start: "2024-04"
  end: present
  shift: Helped bring partnership work once managed country by country together across Europe.
  text: Responsible for ANA's relationships with major travel partners across Europe, spanning business travel, leisure, distribution and joint-venture activity.
  points:
    - Helped make the case for a pan-European approach to trade partnerships, gained support from senior leadership and helped shape the function launched in 2024.
    - Set priorities for key accounts across Europe and introduced clearer plans and regular reviews with partners, country teams and joint-venture colleagues.
    - Developed senior relationships with multinational travel management companies (TMCs), leisure groups and travel technology businesses, exploring new commercial opportunities across Europe.
    - Worked closely with colleagues in Japan to make sure European customer needs were understood and considered in decisions on pricing, distribution and partnerships.

- key: csm
  lane: airline
  title: Country Sales Manager, UK & Ireland
  employer: All Nippon Airways (ANA)
  start: "2013-12"
  end: "2024-03"
  shift: Led sales and B2B marketing in the UK and Ireland, with a team of 12.
  text: The team covered corporate and trade sales, inside sales, data analysis and marketing.
  points:
    - Built ANA's UK trade profile through relationships with travel industry publishers and specialist marketing agencies.
    - Shifted the sales and marketing focus towards premium leisure, non-Japanese corporate customers and specialist travel partners, using targeted campaigns and industry relationships to build awareness of ANA.
    - Worked with Lufthansa joint-venture colleagues to develop leisure net fares and Category 35 and ITX fares for SMEs, creating new business through TMCs and specialist leisure agents.
    - Championed the successful bid to bring the 2019 ABTA Convention to Tokyo, where ANA was a host partner, bringing together UK industry contacts and stakeholders in Japan.
    - Planned early for demand around the 2019 Rugby World Cup in Japan, working on trade outreach, pricing and promotions.
    - Supported the team through COVID-19 with daily contact, practical help on customer and airport requirements, and continued engagement with travel industry partners.
    - Coached colleagues and gave them opportunities to take on wider responsibilities, supporting their progression into management roles.

